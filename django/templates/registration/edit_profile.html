{% extends "base.html" %}

{% block title %}Edit profile{% endblock %}

{% block content %}

{% if form.errors %}
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
            Your username or password is incorrect!
            {% for field in form  %}
                {% if field.errors %}
                    {{ field.errors }}
                {% endif %}
            {% endfor %}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
{% endif %}

    <div class="col-md-6 offset-md-3">
        <h1>Edit profile</h1>
        <form method="POST" >
            {% csrf_token %}
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">First name</label>
                <input type="text" name="first_name" value="{{ user.first_name }}" required class="form-control" id="exampleInputEmail1">
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Last name</label>
                <input type="text" name="last_name" value="{{ user.last_name }}" required class="form-control" id="exampleInputEmail1">
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input type="email" name="email" value="{{ user.email }}" required class="form-control" id="exampleInputEmail1">
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
        </form>
    </dev>


{% endblock %}
