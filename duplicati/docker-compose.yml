---
services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Sofia
      - SETTINGS_ENCRYPTION_KEY=${DB_KEY} # add key variable in .env file
      - DUPLICATI__WEBSERVICE_PASSWORD=${WEB_PASSWORD} # add key variable in .env file
      - CLI_ARGS= #optional
    volumes:
      - duplicati-config:/config
      # backups directory
      - /srv/docker/duplicati:/backups
      # directories to backup
      - ~/app_data:/source/app_data:ro
      - /var/lib/docker/volumes:/source/docker-volumes:ro
    ports:
      - 8200:8200
    restart: unless-stopped
    networks: 
      - frontend

volumes:
  duplicati-config:

networks:
  frontend:
    external: true # IF NETWORK ALLREADY EXISTS

