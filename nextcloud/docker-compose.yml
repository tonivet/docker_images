    imaginary:
        image: nextcloud/aio-imaginary:latest
        container_name: nextcloud-imaginary
        restart: always
        environment:
            - PORT=9000
        command: -concurrency 50 -enable-url-source -log-level info
        networks:
          - frontend


volumes:
    redis_data:
    elasticsearch:
    apps:
    config:

networks:
  frontend:
    external: true # IF NETWORK ALLREADY EXISTS