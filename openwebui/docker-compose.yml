
services:      
  ollama:
    container_name: ollama
    hostname: ollama
    image: ollama/ollama
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - TZ=Europe/Sofia
      - OLLAMA_FLASH_ATTENTION=true
    volumes:
      - ollama-data-share:/root/.ollama
    networks:
      - frontend
    ports:
      - 11434:11434
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  open-webui:
    container_name: open-webui
    hostname: open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - TZ=Europe/Sofia
    volumes:
      - /opt/ollama-webui-data:/app/backend/data
    networks:
      - frontend
    labels:
      - traefik.enable=true
      - traefik.http.routers.openwebui.rule=Host(`ai.feedmix.eu`)
      - traefik.http.routers.openwebui.tls=true
      - traefik.http.routers.openwebui.tls.certresolver=production
      - traefik.http.routers.openwebui.entrypoints=websecure
      - traefik.http.routers.openwebui.service=openwebui
      - traefik.http.services.openwebui.loadbalancer.server.port=8080
      # crowdsec middleware 
      - "traefik.http.routers.openwebui.middlewares=crowdsec-bouncer@docker,crowdsec-appsec@file"

  searxng:
    image: searxng/searxng:latest
    hostname: searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`${SEARXNG_DOMAIN}`)"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.routers.searxng.tls.certresolver=production"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
      # Basic authentication and crowdsec
      - "traefik.http.middlewares.searxng-auth.basicauth.users=${SEARXNG_USER}:${SEARXNG_PASS}"
      - "traefik.http.routers.searxng.middlewares=searxng-auth,crowdsec-bouncer@docker,crowdsec-appsec@file"

volumes:
  ollama-data-share:
    driver: local   

networks:
  frontend:
  # use this flag if network is allready created
    external: true