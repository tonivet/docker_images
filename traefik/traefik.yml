global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: DEBUG

api:
  dashboard: true
  insecure: true

entryPoints: 
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # allow uploding big files
    transport:
      respondingTimeouts:
        readTimeout: 24h
    # telling traeifk to trust only X-Forwarded-* headers coming from Docker network 172.18.0.0/16
    forwardedHeaders:
      trustedIPs:
        - "172.18.0.0/16"

certificatesResolvers:
  staging:
    acme:
      email: ${EMAIL} # ADD YOUR EMAIL HERE
      storage: /ssl-certs/acme.json
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web
  production:
    acme:
      email: ${EMAIL} # ADD YOUR EMAIL HERE
      storage: /ssl-certs/acme.json
      caServer: "https://acme-v02.api.letsencrypt.org/directory"
      httpChallenge:
        entryPoint: web

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: frontend
  file:
    filename: /etc/traefik/config.yml