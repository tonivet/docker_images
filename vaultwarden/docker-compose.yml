services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      DOMAIN: "https://vault.feedmix.eu"
      SIGNUPS_ALLOWED: false
    volumes:
      - ./vw-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`vault.feedmix.eu`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls=true
      - traefik.http.routers.vaultwarden.tls.certresolver=production
      # crowdsec middleware
      - "traefik.http.routers.vaultwarden.middlewares=crowdsec-bouncer@docker,crowdsec-appsec@file"
    networks:
      - frontend


networks:
  frontend:
    external: true